name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: 'clang-format'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run clang-format
        run: |
          find WebService Client \( -iname '*.h' -o -iname '*.cpp' \) \
            -not -path 'Client/App/lua-5.1.1/*' \
            -not -path 'Client/Network/raknet30/*' \
            -not -path 'Client/fmod/*' \
            -not -path 'Client/Rendering/g3d/*' \
            -not -path 'Client/Rendering/SDL-1.2.6/*' \
            -not -path 'Client/Rendering/Mesa-6.5/*' \
            -not -path 'Client/Rendering/OgreSDK/*' \
            -not -path 'Client/win/Scintilla*' | xargs -r \
          pipx run "clang-format>=22,<23" \
            --style=file \
            -i
      - name: Check diff
        run: |
          git diff --exit-code

  build:
    name: ${{ matrix.name }}
    runs-on: windows-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: 'MSVC (x86)',            arch: 'amd64_x86', config: 'RelWithDebInfo', targets: 'all', package: 'win32' }
          - { name: 'MSVC (x64)',            arch: 'amd64',     config: 'RelWithDebInfo', targets: 'all', package: 'win64' }
          - { name: 'MSVC (x86) clang-tidy', arch: 'amd64_x86', config: 'Debug', targets: 'app network', clang-tidy: true }
    steps:
      - uses: actions/checkout@v6

      - name: Setup vcvars
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: ${{ matrix.arch }}

      - name: Setup ninja
        uses: ashutoshvarma/setup-ninja@master

      - name: Install LLVM
        if: ${{ matrix.clang-tidy }}
        uses: KyleMayes/install-llvm-action@v2
        with:
          version: '21'

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build -G Ninja `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DENABLE_CLANG_TIDY=${{ !!matrix.clang-tidy }}
          cmake --build build --target ${{ matrix.targets }} -- -k0

      - name: Package
        if: ${{ matrix.package }}
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force build/dist/openrbx/Roblox, build/dist/openrbx/RBXGS | Out-Null
          Copy-Item build/Roblox.exe, build/Roblox.pdb, build/AppSettings.xml, build/ReflectionMetadata.xml, build/copyrights.txt, build/fmodex*.dll, build/SciLexer.dll, build/rgmain.dll, build/rgpar.dll, build/rggl.dll, build/rgdx.dll build/dist/openrbx/Roblox
          Copy-Item build/WebService.exe, build/WebService.pdb, build/fmodex*.dll, build/3rdparty/OPENGL32.DLL, build/3rdparty/GLU32.DLL, build/3rdparty/OSMESA32.DLL build/dist/openrbx/RBXGS
          Compress-Archive -Path build/dist/openrbx/* -DestinationPath build/dist/openrbx-${{ matrix.package }}.zip

      - name: Upload Build Artifacts
        if: ${{ matrix.package }}
        uses: actions/upload-artifact@v7
        with:
          name: '${{ matrix.name }}'
          path: build/dist/openrbx-*.zip

  linux:
    name: 'GCC (x64)'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y g++-14 ninja-build

      - name: Build
        run: |
          cmake -S . -B build -G Ninja \
            -DCMAKE_C_COMPILER=gcc-14 \
            -DCMAKE_CXX_COMPILER=g++-14 \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo
          cmake --build build -- -k0

      - name: Package
        run: |
          mkdir -p build/dist/openrbx/RBXGS
          cp build/WebService build/libOSMesa.so build/libfmodex64.so build/dist/openrbx/RBXGS
          tar -C build/dist/openrbx -czf build/dist/openrbx-linux64.tar.gz RBXGS

      - name: Upload Build Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: 'GCC (x64)'
          path: build/dist/openrbx-*.tar.gz

  release:
    name: 'Release'
    if: ${{ github.event_name == 'push' && github.ref_name == 'main' && github.repository == 'OpenRBX-org/OpenRBX' }}
    runs-on: ubuntu-latest
    needs:
      - clang-format
      - build
      - linux
    permissions:
      contents: write
    steps:
      - name: Download All Artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*"
          path: Release
          merge-multiple: true

      - name: Checkout uploadtool
        uses: actions/checkout@v6
        with:
          repository: 'probonopd/uploadtool'
          path: 'uploadtool'

      - name: Upload Continuous Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ./uploadtool/upload.sh Release/*
